[project]
name = "atom-habits"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.7.0",
    "django>=6.1.3",
    "django-celery-beat>=2.9.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg2-binary>=2.9.13",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[tool.uv]
# django-celery-beat ограничивает Django<6.1
override-dependencies = ["django>=6.1.2"]

[dependency-groups]
dev = [
    "coverage>=7.17.4",
    "pre-commit>=4.7.0",
]
lint = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
target-version = "py314"
line-length = 119
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle
]
ignore = [
    "E203",  # whitespace before ':'
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["D", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["^.venv/", "^venv/", "__pycache__", "tests/", "^.*/migrations/.*$"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "*/migrations/*",
    "manage.py",
    "readme_gen.py",
    "config/asgi.py",
    "config/wsgi.py",
]
